<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prototype luweb</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9eaff',
              500: '#2563eb',
              600: '#1d4ed8',
              700: '#1e40af',
              900: '#1e3a8a'
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Unofficial Disclaimer Banner -->
  <div class="bg-slate-900 text-slate-200 text-xs py-2 px-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span>Not the official university website — built by students to centralize schedules, documents, and more.</span>
      </div>
      <a id="btn-grades-portal" href="http://sisol.ul.edu.lb/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sky-300 hover:text-sky-200 font-medium underline underline-offset-2 transition">
        <span>Official LU SIS</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      </a>
    </div>
  </div>

  <!-- Main Sticky Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="h-16 flex items-center justify-between gap-3">
        <!-- 3-Line Menu Trigger + Active Window Indicator -->
        <div class="flex items-center gap-3 min-w-0">
          <button id="btn-open-drawer" type="button" aria-label="Open navigation menu" class="inline-flex items-center justify-center w-10 h-10 rounded-xl border border-slate-200 bg-white hover:bg-brand-50 hover:border-brand-500 text-slate-700 hover:text-brand-700 transition shrink-0 shadow-xs">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <button id="btn-brand-home" type="button" class="text-left min-w-0 group">
            <div id="header-active-window" class="font-bold text-slate-900 leading-tight truncate text-sm sm:text-base group-hover:text-brand-600 transition">Today</div>
            <div id="header-scope-label" class="text-[11px] text-slate-500 truncate">Faculty of Sciences · Branch 4</div>
          </button>
        </div>

        <!-- Global Quick Search -->
        <div class="hidden md:flex flex-1 max-w-md mx-2">
          <div class="relative w-full">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/></svg>
            <input id="global-search-input" type="text" placeholder="Jump to course code (e.g. M1101, I2201) or document..." class="w-full pl-9 pr-3 py-2 text-sm bg-slate-100 border border-transparent rounded-lg focus:bg-white focus:border-brand-500 focus:outline-none transition" />
          </div>
        </div>

        <!-- Right Controls: Light/Dark Switch + Active Admin Pill -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="inline-flex p-0.5 rounded-lg border border-slate-200 bg-slate-100" role="group" aria-label="Theme switch">
            <button id="btn-theme-light" type="button" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold transition bg-white text-slate-900 shadow-xs">
              <span>☀️</span>
              <span class="hidden sm:inline">Light</span>
            </button>
            <button id="btn-theme-dark" type="button" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold transition text-slate-500 hover:text-slate-900">
              <span>🌙</span>
              <span class="hidden sm:inline">Dark</span>
            </button>
          </div>
          <div id="header-admin-pill" class="hidden items-center gap-2 shrink-0">
            <button id="btn-header-admin" type="button" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-amber-200 bg-amber-50 hover:bg-amber-100 transition text-left">
              <span id="role-badge-dot" class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
              <span id="header-admin-label" class="text-xs font-semibold text-amber-900">Admin</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Slide-Over Navigation Drawer -->
  <div id="slide-drawer-backdrop" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs transition-opacity"></div>
  <aside id="slide-drawer" aria-label="Portal Navigation" class="fixed top-0 left-0 bottom-0 z-50 w-80 max-w-[85vw] bg-white border-r border-slate-200 shadow-2xl transform -translate-x-full transition-transform duration-200 ease-out flex flex-col">
    <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs shrink-0">B4</div>
        <div class="min-w-0">
          <div class="font-bold text-slate-900 text-sm truncate">Menu</div>
        </div>
      </div>
      <button id="btn-close-drawer" type="button" aria-label="Close menu" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="p-4 border-b border-slate-100 md:hidden">
      <div class="relative">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/></svg>
        <input id="mobile-search-input" type="text" placeholder="Search cours or documents..." class="w-full pl-9 pr-3 py-2 text-sm bg-slate-100 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>
    </div>

    <nav id="slide-drawer-list" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>

    <div class="p-3 border-t border-slate-100 bg-slate-50/70 space-y-2">
      <button id="btn-drawer-addpage" type="button" class="hidden w-full items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl border border-dashed border-brand-400 bg-white hover:bg-brand-50 text-brand-700 text-xs font-semibold transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        <span>Add New Window / Page</span>
      </button>
      <button id="btn-drawer-admin" type="button" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50 text-left transition">
        <div class="flex items-center gap-2.5 min-w-0">
          <svg class="w-4 h-4 text-slate-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <div class="min-w-0">
            <div id="drawer-admin-title" class="text-xs font-semibold text-slate-800 truncate">Admin Access</div>
          </div>
        </div>
        <span id="drawer-admin-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 shrink-0">Locked</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Outlet -->
  <main id="app-main" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6"></main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-xs text-slate-500">
      <div>
        <div class="font-semibold text-slate-700">prototype luweb — ULFS4</div>
        <p class="mt-0.5">Student-built web portal for Faculty of Sciences, Branch 4.</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <button id="btn-footer-reset" type="button" class="text-slate-500 hover:text-slate-800 underline underline-offset-2">Reset Demo Data</button>
        <span id="footer-addpage-sep" class="hidden text-slate-300">|</span>
        <button id="btn-footer-addpage" type="button" class="hidden text-brand-600 hover:text-brand-700 font-medium">+ Add Custom Page</button>
      </div>
    </div>
  </footer>

  <!-- Modal Backdrop -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="modal-panel" class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg max-h-[90vh] overflow-y-auto animate-in">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h3 id="modal-title" class="font-semibold text-slate-900 text-base">Modal</h3>
        <button id="btn-close-modal" type="button" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modal-body" class="p-5"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <script src="app.js" defer></script>
</body>
</html>
